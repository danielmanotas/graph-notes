<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="shortcut icon" href="../assets/img/favicon.svg" type="image/x-icon">
    <title>Graph Notes</title>
    <meta name="description" content="Graph Notes una aplicación integra las notas simples con la Teoría de Grafos">

    <div id="mySidebar" class="sidebar" inert>
        <a href="#" id="crearNota"><i class="fas fa-pencil-alt"></i>Crear Nota</a>

        <a href="#" id="grafos"><i class="fas fa-project-diagram"></i> Grafos</a>

    <p id="app-message" role="alert"></p>
    <main class="subContent"></main>

<script src="../js/script.js" type="module"></script>
